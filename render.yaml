services:
  - type: web
    name: toledo-technologies
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: redirect
        source: /codebases
        destination: /codebases/
      - type: redirect
        source: /codebases/aegistwin
        destination: /codebases/aegistwin/
      - type: redirect
        source: /codebases/complycrawl
        destination: /codebases/complycrawl/
      - type: redirect
        source: /codebases/tallysec
        destination: /codebases/tallysec/
      - type: redirect
        source: /checkout-success
        destination: /checkout-success/
      - type: redirect
        source: /portfolio
        destination: /portfolio/
      - type: redirect
        source: /contact
        destination: /contact/
      - type: redirect
        source: /services
        destination: /services/
      - type: redirect
        source: /blog/buying-a-codebase
        destination: /blog/buying-a-codebase/
